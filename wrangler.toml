# mohamedsharaf.com on Cloudflare Workers. Deploy with: sh deploy.sh
#
# The site is served only on the custom domain: no workers.dev address and no
# preview links. Pages and files come straight from static assets, so they are
# free and unlimited and the rules in dist/_headers apply to them. Only /api/*
# runs the Worker code in worker/index.js (the contact form).
name = "mohamedsharaf"
main = "worker/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "mohamedsharaf.com", custom_domain = true }
]

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/*"]

[vars]
CONTACT_FROM = "website@mohamedsharaf.com"
ALLOWED_ORIGINS = "https://mohamedsharaf.com"
TURNSTILE_HOSTNAMES = "mohamedsharaf.com"

# Secrets, set once with `npx wrangler secret put <NAME>` (never committed):
#   TURNSTILE_SECRET  the Turnstile widget's secret key
#   CONTACT_TO        the verified Email Routing destination that receives messages

# Contact messages are emailed to verified Email Routing destinations only (free)
[[send_email]]
name = "EMAIL"

# At most 3 contact attempts per visitor IP per minute
[[ratelimits]]
name = "CONTACT_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 3
  period = 60
