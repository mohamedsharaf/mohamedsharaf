<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#eeeae2">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23e85532'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='monospace' font-size='28' fill='%23eeeae2'%3Em.%3C/text%3E%3C/svg%3E">
  <title>Page not found — Mohamed Sharaf</title>
  <style>
    @font-face{font-family:Manrope;src:url('/assets/manrope-latin.woff2') format('woff2');font-style:normal;font-weight:200 800;font-display:swap}
    :root{--paper:#eeeae2;--ink:#242624;--muted:#5c5d56;--orange:#e85532;--mono:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:Manrope,'Segoe UI',Tahoma,sans-serif;padding:24px}
    main{max-width:520px;width:100%}
    .code{font:12px var(--mono);letter-spacing:.08em;color:#ad3a1c}
    h1{font-size:clamp(44px,10vw,72px);letter-spacing:-.06em;line-height:1;margin:18px 0 16px;font-weight:650}
    p{color:var(--muted);line-height:1.8;margin:0 0 10px;font-size:15px}
    .ar{direction:rtl;text-align:right;margin-top:28px;padding-top:22px;border-top:1px solid #cecdc4}
    .ar h2{font-size:28px;margin:0 0 10px;font-weight:600}
    .links{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
    a{display:inline-block;padding:12px 18px;background:var(--ink);color:var(--paper);text-decoration:none;font-weight:600;font-size:14px}
    a:hover{background:var(--orange);color:#fff}
    a:focus-visible{outline:3px solid var(--orange);outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <div class="code">ERROR 404</div>
    <h1>This page wandered off.</h1>
    <p>The link may be old, or there might be a typo. The rest of the site is right where you left it.</p>
    <div class="links"><a href="/">Back home ↗</a></div>
    <div class="ar" lang="ar">
      <h2>هذه الصفحة غير موجودة.</h2>
      <p>ربما الرابط قديم، أو فيه خطأ بسيط. بقية الموقع في مكانه.</p>
      <div class="links"><a href="/ar">العودة إلى الرئيسية ↖</a></div>
    </div>
  </main>
</body>
</html>
