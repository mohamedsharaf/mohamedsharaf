<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:Manrope;src:url('assets/manrope-latin.woff2') format('woff2');font-weight:200 800}
  @font-face{font-family:'IBM Plex Sans Arabic';src:url('assets/plex-arabic-400.woff2') format('woff2');font-weight:400}
  @font-face{font-family:'IBM Plex Sans Arabic';src:url('assets/plex-arabic-600.woff2') format('woff2');font-weight:600}
  @font-face{font-family:Amiri;src:url('assets/amiri-arabic.woff2') format('woff2');font-weight:400}
  :root{--paper:#eeeae2;--ink:#242624;--orange:#e85532;--ink-orange:#ad3a1c;--muted:#5f6059;--line:#cecdc4}
  *{box-sizing:border-box;margin:0}
  html,body{width:2560px;height:1440px;overflow:hidden}
  body{background:var(--paper);color:var(--ink);font-family:Manrope,'IBM Plex Sans Arabic',sans-serif;position:relative}
  /* faint paper grain, like the site */
  body::before{content:'';position:absolute;inset:0;opacity:.05;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23000' filter='url(%23n)' opacity='.5' d='M0 0h180v180H0z'/%3E%3C/svg%3E")}

  /* The band every device shows (2560x423) and the phone-safe area (1546x423) */
  .band{position:absolute;left:0;right:0;top:508px;height:423px;border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
  .safe{position:absolute;left:507px;width:1546px;top:508px;height:423px;padding:0 80px;display:grid;grid-template-columns:1fr 2px 1fr;align-items:center;column-gap:56px}
  .divider{height:250px;background:var(--orange);opacity:.85}
  .side{display:flex;flex-direction:column;gap:18px}
  .en{align-items:flex-start}
  .ar{direction:rtl;align-items:flex-start}
  .name{display:flex;align-items:center;gap:14px;font-size:28px;font-weight:750;letter-spacing:-1px}
  .ar .name{font-weight:600;letter-spacing:0}
  .sym{display:grid;grid-template-columns:repeat(2,12px);gap:4px;transform:rotate(-7deg)}
  .sym i{width:12px;height:12px;background:var(--orange)}
  .sym i:last-child{opacity:.35}
  h1{font-size:96px;line-height:1.05;letter-spacing:-.08em;font-weight:650;white-space:nowrap}
  h1 em{font-family:Georgia,serif;font-weight:400;color:var(--orange);letter-spacing:-.06em}
  .ar h1{font-size:86px;line-height:1.3;letter-spacing:0;font-weight:600}
  .ar h1 em{font-family:Amiri,serif;font-style:normal;letter-spacing:0;font-size:1.12em}
  .tag{white-space:nowrap;font:600 18px 'SFMono-Regular',Menlo,monospace;letter-spacing:.08em;color:var(--ink-orange);text-transform:uppercase}
  .ar .tag{font:600 23px 'IBM Plex Sans Arabic',sans-serif;letter-spacing:0}

  /* Desktop/TV-only decoration, outside the phone-safe area */
  .stamp{position:absolute;top:595px;left:2190px;width:250px;height:250px;border-radius:50%;background:#c9441f;outline:12px solid #c9441f;border:2px dashed #ffffff80;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(12deg);font:20px 'SFMono-Regular',Menlo,monospace;letter-spacing:.08em;gap:4px}
  .stamp strong{font:650 70px Manrope,sans-serif;letter-spacing:-4px;line-height:1}
  .squares{position:absolute;top:640px;left:150px;display:grid;grid-template-columns:repeat(2,64px);gap:22px;transform:rotate(-7deg)}
  .squares i{width:64px;height:64px;background:var(--orange)}
  .squares i:last-child{opacity:.35}
  .url{position:absolute;top:960px;left:0;right:0;text-align:center;font:24px 'SFMono-Regular',Menlo,monospace;letter-spacing:.12em;color:var(--muted)}
</style>
</head>
<body>
  <div class="band"></div>
  <div class="squares"><i></i><i></i><i></i><i></i></div>
  <div class="safe">
    <div class="side en">
      <div class="name"><span class="sym"><i></i><i></i><i></i><i></i></span>Mohamed Sharaf</div>
      <h1>Still <em>curious.</em></h1>
      <div class="tag">Security · Infrastructure · Software · AI</div>
    </div>
    <div class="divider"></div>
    <div class="side ar" lang="ar">
      <div class="name"><span class="sym"><i></i><i></i><i></i><i></i></span>محمد شرف</div>
      <h1>ما زلتُ <em>فضوليًا.</em></h1>
      <div class="tag">أمن · بنية تحتية · برمجيات · ذكاء اصطناعي</div>
    </div>
  </div>
  <div class="stamp"><span>AT THE KEYBOARD</span><strong>1996</strong><span>AND COUNTING</span></div>
  <div class="url">MOHAMEDSHARAF.COM</div>
</body>
</html>
